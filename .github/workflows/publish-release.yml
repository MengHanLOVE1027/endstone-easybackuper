name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      # ────────────────────────────────────
      # 1. 环境准备
      # ────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      # ────────────────────────────────────
      # 2. 提取版本号
      # ────────────────────────────────────
      - name: Get version from source
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "import re;c=open('src/endstone_easybackuper/easybackuper_plugin.py').read();m=re.search(r'^plugin_version\s*=\s*\"(.+?)\"',c,re.M);print(m.group(1) if m else '0.0.0')")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Source version: $VERSION"

          # 如果是 tag 触发的，校验版本号一致
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_VERSION="${{ github.ref_name }}"
            TAG_VERSION="${TAG_VERSION#v}"
            if [ "$TAG_VERSION" != "$VERSION" ]; then
              echo "::error::Tag version ($TAG_VERSION) does not match source version ($VERSION)"
              exit 1
            fi
            echo "Version validated: tag=$TAG_VERSION, source=$VERSION"
          fi

      # ────────────────────────────────────
      # 3. 构建 Python wheel
      # ────────────────────────────────────
      - name: Build Python wheel
        run: |
          python -m build --wheel
          echo "----- dist/ -----"
          ls -la dist/

      # ────────────────────────────────────
      # 4. 构建 Go 二进制文件
      # ────────────────────────────────────
      - name: Build Go — restore_handler (Windows)
        working-directory: go/restore_handler
        run: |
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o restore_handler.exe main.go
          echo "Built: restore_handler.exe"

      - name: Build Go — restore_handler_en (Windows)
        working-directory: go/restore_handler_en
        run: |
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o restore_handler_en.exe main_en.go
          echo "Built: restore_handler_en.exe"

      - name: Build Go — restore_handler (Linux)
        working-directory: go/restore_handler
        run: |
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o restore_handler_linux main.go
          echo "Built: restore_handler_linux"

      - name: Build Go — restore_handler_en (Linux)
        working-directory: go/restore_handler_en
        run: |
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o restore_handler_en_linux main_en.go
          echo "Built: restore_handler_en_linux"

      # ────────────────────────────────────
      # 5. 收集产物
      # ────────────────────────────────────
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p artifacts

          cp dist/*.whl   artifacts/ 2>/dev/null || true
          cp dist/*.tar.gz artifacts/ 2>/dev/null || true

          cp go/restore_handler/restore_handler.exe         artifacts/ 2>/dev/null || true
          cp go/restore_handler_en/restore_handler_en.exe     artifacts/ 2>/dev/null || true
          cp go/restore_handler/restore_handler_linux         artifacts/ 2>/dev/null || true
          cp go/restore_handler_en/restore_handler_en_linux   artifacts/ 2>/dev/null || true

          echo "----- artifacts/ -----"
          ls -la artifacts/

      # ────────────────────────────────────
      # 6. 生成 Release 说明
      # ────────────────────────────────────
      - name: Generate release notes
        id: changelog
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"

          case "$VERSION" in
            *beta*|*alpha*|*rc*|*dev*) TYPE="🧪 测试版" ;;
            *)                         TYPE="🚀 正式版" ;;
          esac

          # 获取上一版本 tag
          git fetch --tags --force
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "v${VERSION}" | head -n1)

          if [ -n "$PREV_TAG" ]; then
            DETAILS=$(gh api "repos/${{ github.repository }}/compare/${PREV_TAG}...HEAD" \
              --jq '[.commits[]? | select(.author.login != "github-actions[bot]")] | map("- \(.commit.message | split("\n")[0]) (@\(.author.login))") | join("\n")' \
              2>/dev/null || echo "")

            AUTHORS=$(gh api "repos/${{ github.repository }}/compare/${PREV_TAG}...HEAD" \
              --jq '[.commits[]?.author.login // empty] | unique | map(select(. != "github-actions[bot]")) | map("@" + .) | join(" ")' \
              2>/dev/null || echo "")

            CHANGELOG_LINK="https://github.com/${{ github.repository }}/compare/${PREV_TAG}...v${VERSION}"
          else
            DETAILS="- 🎉 EasyBackuper v${VERSION} 首次发布"
            AUTHORS=""
            CHANGELOG_LINK=""
          fi

          DETAILS="${DETAILS:-（暂无提交信息）}"
          AUTHORS="${AUTHORS:-（暂无）}"

          cat > /tmp/release_body.md <<BODYEOF
          ## ${TYPE}: EasyBackuper v${VERSION}

          ### 📦 下载 · Downloads

          | 平台 | 文件 | 语言 |
          |------|------|------|
          | 🐍 Python | \`*.whl\` | — |
          | 🐍 Python | \`*.tar.gz\` | — |
          | 🪟 Windows | \`restore_handler.exe\` | 中文 |
          | 🪟 Windows | \`restore_handler_en.exe\` | English |
          | 🐧 Linux | \`restore_handler_linux\` | 中文 |
          | 🐧 Linux | \`restore_handler_en_linux\` | English |

          ### 📝 更新内容 · Changes

          ${DETAILS}

          ### 👥 贡献者 · Contributors

          ${AUTHORS}

          ### 🔧 安装 · Installation

          \`\`\`bash
          pip install endstone_easybackuper-*.whl
          \`\`\`

          或从下方 Assets 下载对应平台的可执行文件，放入插件目录即可。
          BODYEOF

          if [ -n "$CHANGELOG_LINK" ]; then
            printf '\n**Full Changelog**: %s\n' "$CHANGELOG_LINK" >> /tmp/release_body.md
          fi

          {
            echo 'body<<BODYEOF'
            cat /tmp/release_body.md
            echo 'BODYEOF'
          } >> "$GITHUB_OUTPUT"

          echo "Release notes generated"

      # ────────────────────────────────────
      # 7. 发布 Release
      # ────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "v${{ steps.version.outputs.version }}"
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'dev') }}
          files: |
            artifacts/*.whl
            artifacts/*.tar.gz
            artifacts/*.exe
            artifacts/restore_handler_linux
            artifacts/restore_handler_en_linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
